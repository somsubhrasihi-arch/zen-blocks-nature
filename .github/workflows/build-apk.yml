name: Build Zen Blocks Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.zenblocks.nature .
      - name: Apply app name and T-piece launcher icon
        run: python tools/configure_branding.py
      - name: Install dependencies
        run: flutter pub get
      - name: Run unit tests
        run: rm -f test/widget_test.dart && flutter test
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T-BLOCK-UI-Previews
          path: build/ui-previews/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenBlocks-Nature-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
