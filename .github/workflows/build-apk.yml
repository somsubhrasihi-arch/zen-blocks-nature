name: Build Zen Blocks Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, feature/unified-buddy-design]
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.zenblocks.nature .
      - name: Apply app name and T-piece launcher icon
        run: python tools/configure_branding.py
      - name: Verify sample AdMob manifest configuration
        run: |
          python - <<'PYCODE'
          import xml.etree.ElementTree as ET
          root = ET.parse('android/app/src/main/AndroidManifest.xml').getroot()
          ns = '{http://schemas.android.com/apk/res/android}'
          entries = [m.get(ns+'value') for m in root.find('application').findall('meta-data') if m.get(ns+'name') == 'com.google.android.gms.ads.APPLICATION_ID']
          assert entries == ['ca-app-pub-3940256099942544~3347511713'], 'Test APK must use the Google sample App ID'
          assert any(p.get(ns+'name') == 'android.permission.INTERNET' for p in root.findall('uses-permission')), 'Internet permission missing'
          print('Sample App ID and internet permission verified.')
          PYCODE
      - name: Install dependencies
        run: flutter pub get
      - name: Check native validation tools
        run: python -m unittest discover -s tools -p '*_test.py'
      - name: Run unit tests
        run: rm -f test/widget_test.dart && flutter test
      - name: Upload UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: T-BLOCK-UI-Previews
          path: build/ui-previews/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build APK
        run: flutter build apk --debug --dart-define=ADS_TEST_MODE=true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZenBlocks-Nature-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
